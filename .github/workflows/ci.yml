name: Offline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    env:
      RUN_LIVE: ""
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: CLI help smoke
        run: |
          amazon-es --help
          amazon-es multisource --help
          python -m amazon_es_bestseller.highspeed.v4_cli --help
      - name: Compile source
        run: python -m compileall src
      - name: Run offline tests
        run: python -m pytest -q -rs

  browser-faults:
    name: Offline browser fault tests
    runs-on: ubuntu-latest
    env:
      RUN_LIVE: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Install isolated fixture browser
        run: python -m playwright install --with-deps chromium
      - name: Test fixture-only browser faults and operator wait
        run: >-
          python -m pytest -q
          tests/parallel/test_parallel_fault_browser.py
          tests/parallel/test_parallel_fault_alerts.py
          tests/parallel/test_parallel_preflight.py
