[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-es-bestseller"
version = "0.1.0"
description = "Conservative Amazon.es bestseller research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "playwright>=1.40",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
amazon-es = "amazon_es_bestseller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
